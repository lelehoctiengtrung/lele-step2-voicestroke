<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Đấu Từ Vựng - Reel Template</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Noto+Serif+SC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #050811; font-family: 'Outfit', sans-serif;
            color: #2c251f;
        }

        .reel-container {
            position: relative;
            width: 540px;
            height: 960px;
            background: #f4f1ea; /* Warm gray */
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 0 0 0 8px #4a3728;
        }

        .content {
            position: absolute;
            top: 0;
            left: 0;
            width: 400px;
            height: 711.11px;
            transform: scale(1.35);
            transform-origin: top left;
            z-index: 10;
            display: flex; flex-direction: column;
            justify-content: flex-start;
            padding: 30px 15px 15px 15px;
        }

        .header {
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 8px;
            width: 100%;
        }

        .series-title {
            background: rgba(153, 27, 27, 0.06);
            border: 1px solid rgba(153, 27, 27, 0.2);
            padding: 4px 24px; border-radius: 30px;
            color: #991b1b; font-weight: 800; letter-spacing: 2px; font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* Split screen grid */
        .vs-container {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 12px;
        }

        .vs-column {
            display: flex;
            flex-direction: column;
            flex: 1;
            border-radius: 16px;
            padding: 12px 10px;
            position: relative;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            opacity: 1;
        }

        /* Column Left: Brick Red */
        .vs-column.left {
            background: #fef2f2;
            border: 2px solid #fee2e2;
            box-shadow: 0 4px 15px rgba(153, 27, 27, 0.05);
        }
        .vs-column.left.active-focus {
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
            transform: scale(1.02);
        }

        /* Column Right: Emerald Green */
        .vs-column.right {
            background: #f0fdf4;
            border: 2px solid #dcfce7;
            box-shadow: 0 4px 15px rgba(6, 95, 70, 0.05);
        }
        .vs-column.right.active-focus {
            border-color: #22c55e;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
            transform: scale(1.02);
        }

        /* Title characters */
        .vs-title {
            font-family: 'Noto Serif SC', 'Noto Serif TC', 'Noto Sans CJK SC', 'Noto Sans CJK TC', serif, sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            text-align: center;
            height: 32px;
            line-height: 32px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .left .vs-title { color: #991b1b; }
        .right .vs-title { color: #065f46; }

        /* Badge for word kind or pinyin */
        .vs-pinyin {
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
            color: #4a5568;
            height: 16px;
            line-height: 16px;
            margin-bottom: 8px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grammar Rule card */
        .rule-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.68rem;
            line-height: 1.35;
            color: #2d3748;
            margin-bottom: 8px;
            border-left: 3px solid;
            font-weight: 600;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .left .rule-card { border-left-color: #ef4444; }
        .right .rule-card { border-left-color: #22c55e; }

        /* Example section */
        .example-section {
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        
        .example-label {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #718096;
            margin-bottom: 4px;
        }

        .example-zh {
            font-family: 'Noto Serif SC', 'Noto Serif TC', 'Noto Sans CJK SC', 'Noto Sans CJK TC', serif, sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.25;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 2px;
        }
        .left .example-zh { color: #991b1b; }
        .right .example-zh { color: #065f46; }

        .example-vi {
            font-size: 0.68rem;
            color: #4a5568;
            line-height: 1.3;
            font-weight: 500;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .vs-badge {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1.1);
            background: #2d3748;
            color: #ffffff;
            font-weight: 900;
            font-size: 0.95rem;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            border: 4px solid #f4f1ea;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 100;
            letter-spacing: 0.5px;
        }

        .brand-tag {
            font-size: 0.6rem;
            color: #991b1b;
            opacity: 0.55;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-align: center;
            margin-top: 0px;
            margin-bottom: 8px;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }

        /* Side-by-side Square Illustration Cards */
        .vs-images-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
            margin-bottom: 12px;
        }

        .vs-image-card {
            flex: 1;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vs-image-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .reel-subtitles {
            width: 100%;
            min-height: 65px;
            margin-top: auto; /* Push to the very bottom */
            background: #fafaf5; /* Ivory / Ngà background */
            border-radius: 12px;
            border: 2px solid #991b1b; /* Brick red border */
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(153, 27, 27, 0.05);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: normal;
            color: #2c251f; /* Dark text */
            line-height: 1.4;
            letter-spacing: 0.5px;
            text-align: center;
            opacity: 1; /* Always visible */
            pointer-events: none;
        }

        .flash-active {
            animation: flashHighlight 1.5s ease-in-out;
        }

        @keyframes flashHighlight {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .storyboard-controls { display: none !important; }
    </style>
</head>
<body>

    <div class="reel-container" id="stage" data-composition-id="main" data-start="0" data-duration="40" data-width="540" data-height="960">
        <div class="content">
            <div class="header">
                <div class="series-title">Song Đấu Từ Vựng</div>
            </div>

            <div class="brand-tag">lelehoctiengtrung</div>

            <!-- Side-by-Side Square Illustration Cards -->
            <div class="vs-images-container">
                <div class="vs-image-card">
                    <img src="cropped_transparent_left.png" alt="Word A Illustration">
                </div>
                <div class="vs-image-card">
                    <img src="cropped_transparent_right.png" alt="Word B Illustration">
                </div>
            </div>

            <div style="position: relative; width: 100%; height: 270px;">
                <div class="vs-badge">VS</div>
                
                <div class="vs-container">
                    <!-- Left Word Card -->
                    <div id="vs-card-left" class="vs-column left">
                        <div class="vs-title">刚</div>
                        <div class="vs-pinyin">gāng</div>
                        <div class="rule-card">
                            Phó từ. Chỉ đứng ngay TRƯỚC động từ.
                        </div>
                        <div class="example-section">
                            <div class="example-label">Ví dụ:</div>
                            <div class="example-zh">我刚到。</div>
                            <div class="example-vi">Tôi vừa mới đến.</div>
                        </div>
                    </div>

                    <!-- Right Word Card -->
                    <div id="vs-card-right" class="vs-column right">
                        <div class="vs-title">刚才</div>
                        <div class="vs-pinyin">gāngcái</div>
                        <div class="rule-card">
                            Danh từ thời gian. Đứng trước hoặc sau chủ ngữ.
                        </div>
                        <div class="example-section">
                            <div class="example-label">Ví dụ:</div>
                            <div class="example-zh">刚才我去商店了。</div>
                            <div class="example-vi">Vừa nãy tôi đi cửa hàng rồi.</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="subtitles-box" class="reel-subtitles"></div>
        </div>

        <!-- Audio list is dynamic and will be injected here -->
        <div style="display: none;">
            <!-- AUDIO_PLACEHOLDER -->
        </div>
    </div>

    <script>
        const autoPlayTotalDuration = 40;
        const mainTimeline = gsap.timeline({ paused: true });
        
        mainTimeline.to({}, { 
            duration: autoPlayTotalDuration,
            onUpdate: function() {
                const currentTime = this.time();
                setSimulationTime(currentTime);
            }
        });
        
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = mainTimeline;

        const subtitleData = [];

        function setSimulationTime(time) {
            const cardLeft = document.getElementById('vs-card-left');
            const cardRight = document.getElementById('vs-card-right');
            
            if (cardLeft) {
                cardLeft.style.opacity = '1';
                cardLeft.style.transform = 'translateY(0)';
            }
            if (cardRight) {
                cardRight.style.opacity = '1';
                cardRight.style.transform = 'translateY(0)';
            }
            
            // First frame cover support
            if (time === 0) {
                if (cardLeft) cardLeft.classList.remove('active-focus');
                if (cardRight) cardRight.classList.remove('active-focus');
                updateSubtitles(0);
                return;
            }

            // Timeline appearance controls
            // LEFT CARD TIMINGS PLACEHOLDER
            // RIGHT CARD TIMINGS PLACEHOLDER

            // FLASH_TRIGGERS_PLACEHOLDER

            updateSubtitles(time);
        }

        function updateSubtitles(time) {
            const subBox = document.getElementById('subtitles-box');
            const activeSub = subtitleData.find(sub => time >= sub.start && time < sub.end);
            
            if (activeSub) {
                if (subBox.innerHTML !== activeSub.text) {
                    subBox.innerHTML = activeSub.text;
                }
            } else {
                if (subBox.innerHTML !== "") {
                    subBox.innerHTML = "";
                }
            }
        }

        window.addEventListener("hf-seek", (e) => {
            setSimulationTime(e.detail.time);
        });
    </script>
</body>
</html>
