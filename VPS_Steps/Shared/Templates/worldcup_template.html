<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Trung Qua World Cup 2026 - Reel Template</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Montserrat:wght@700;900&family=Noto+Serif+TC:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #f3f4f6; font-family: 'Outfit', sans-serif;
            color: #1f2937;
        }

        .reel-container {
            position: relative;
            width: 540px;
            height: 960px;
            background: #ffffff; /* Pure white template background */
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 8px #00E676; /* Neon Green outer glow */
        }

        /* Diagonal background stadium lights */
        .stadium-glow {
            position: absolute;
            top: -20%; left: -20%;
            width: 140%; height: 140%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.04) 0%, rgba(0, 230, 118, 0.02) 50%, transparent 80%);
            pointer-events: none;
            z-index: 1;
        }

        .content {
            position: absolute;
            top: 0;
            left: 0;
            width: 400px;
            height: 711.11px;
            transform: scale(1.35);
            transform-origin: top left;
            z-index: 10;
            display: flex; flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 24px 20px;
        }

        .header {
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 8px;
            width: 100%;
            z-index: 5;
        }

        .series-title {
            background: rgba(0, 230, 118, 0.1);
            border: 1.5px solid #00E676; /* Neon Green border */
            padding: 5px 20px; border-radius: 30px;
            color: #00C853; font-weight: 900; letter-spacing: 1.5px; font-size: 0.75rem;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 0 12px rgba(0, 230, 118, 0.15);
            display: flex; align-items: center; gap: 6px;
        }

        .brand-tag {
            font-size: 0.65rem;
            color: #00b0ff; /* Rich Cyan */
            opacity: 0.9;
            font-weight: 800;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 8px;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            z-index: 5;
            text-transform: uppercase;
        }

        /* Word Presentation Box */
        .word-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 8px;
            z-index: 5;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        .word-title-box {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.6rem;
            font-weight: 900;
            color: #b45309; /* Deep Gold/Amber */
            text-shadow: 1px 1px 0px rgba(0, 0, 0, 0.1);
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 2px;
        }

        .pinyin {
            font-size: 1.1rem;
            color: #374151; /* Slate/Dark Grey */
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 2px;
            background: #f3f4f6; /* Light grey background */
            padding: 2px 14px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        /* Illustration card */
        .illustration-card {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.8s ease;
            overflow: hidden;
            background: transparent;
            border: none;
            z-index: 3;
            margin-bottom: 6px;
        }

        .illustration-card img {
            width: 95%;
            height: 95%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0, 230, 118, 0.15));
        }

        /* Teams list container for group stages */
        .teams-list-container {
            width: 95%;
            flex: 1;
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
            z-index: 3;
        }

        .team-item-card {
            background: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 6px 14px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
            position: relative;
            overflow: visible;
        }

        .team-item-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 6px; height: 100%;
            background: #00E676;
            opacity: 0.85;
        }

        .team-player-wrapper {
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-shrink: 0;
            overflow: visible;
        }

        .team-player-img {
            max-width: 95px;
            max-height: 95px;
            object-fit: contain;
            position: absolute;
            bottom: -5px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
        }

        .team-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
        }

        .team-english {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 900;
            color: #1f2937;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .team-chinese-reading {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            color: #059669; /* Emerald Green */
            margin-top: 1px;
            letter-spacing: 0.5px;
        }

        /* Fun fact card style */
        .fun-fact-container {
            width: 95%;
            flex: 1;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 24px;
            background: #ffffff;
            border: 2px dashed #FFD700; /* Gold dashed border */
            border-radius: 20px;
            margin-bottom: 8px;
            z-index: 3;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            position: relative;
        }

        .fun-fact-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 6px; height: 100%;
            background: #FFD700;
            opacity: 0.85;
        }

        .fun-fact-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 900;
            color: #b45309; /* Deep Gold */
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .fun-fact-text {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 800;
            color: #1f2937;
            line-height: 1.5;
        }

        /* Subtitle Container - Bottom Area */
        .reel-subtitles {
            width: 100%;
            min-height: 85px;
            margin-top: 5px;
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            z-index: 500;
            padding: 12px 16px;
            background: rgba(13, 18, 38, 0.75); /* Dark translucent background */
            border-radius: 16px;
            border: 1.5px solid rgba(0, 230, 118, 0.3); /* Neon green translucent border */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 230, 118, 0.1);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }

        .reel-subtitles-inner {
            width: 100%;
            max-height: 100%;
            overflow: hidden;
        }

        .shake-active {
            animation: cardShake 0.5s ease-in-out;
        }

        @keyframes cardShake {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-2deg) scale(1.03); }
            40% { transform: rotate(2deg) scale(1.03); }
            60% { transform: rotate(-2deg); }
            80% { transform: rotate(2deg); }
        }

        @keyframes bounceIn {
            from { opacity: 0; transform: scale(0.4); }
            50% { opacity: 0.9; transform: scale(1.06); }
            70% { transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .storyboard-controls { display: none !important; }
    </style>
</head>
<body>

    <div class="reel-container" id="stage" data-composition-id="main" data-start="0" data-duration="40" data-width="540" data-height="960">
        <div class="stadium-glow"></div>
        <div class="content">
            <div class="header">
                <div class="series-title">🏆 Học Tiếng Trung Qua WC 2026</div>
            </div>

            <div class="brand-tag">lelehoctiengtrung</div>

            <!-- World Cup Word Title -->
            <div class="word-wrapper" id="slang-title-wrapper">
                <div class="word-title-box">吃瓜</div>
                <div class="pinyin">chī guā</div>
            </div>

            <!-- World Cup Illustration -->
            <div id="illustration-card" class="illustration-card">
                <img src="cropped_transparent.png" alt="World Cup Illustration">
            </div>

            <!-- Teams List (Only for Group stages) -->
            <div id="teams-list-container" class="teams-list-container"></div>

            <!-- Fun Fact Container (For World Cup topics/groups) -->
            <div id="fun-fact-container" class="fun-fact-container">
                <div class="fun-fact-title">💡 ĐIỀU THÚ VỊ</div>
                <div id="fun-fact-text" class="fun-fact-text"></div>
            </div>

            <!-- Translucent Subtitles Box -->
            <div id="subtitles-box" class="reel-subtitles">
                <div id="subtitles-inner" class="reel-subtitles-inner">Đang tải kịch bản...</div>
            </div>
        </div>

        <!-- Audio list is dynamic and will be injected here -->
        <div style="display: none;">
            <!-- AUDIO_PLACEHOLDER -->
        </div>
    </div>

    <script>
        const autoPlayTotalDuration = 40;
        const mainTimeline = gsap.timeline({ paused: true });
        
        mainTimeline.to({}, { 
            duration: autoPlayTotalDuration,
            onUpdate: function() {
                const currentTime = this.time();
                setSimulationTime(currentTime);
            }
        });
        
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = mainTimeline;

        const subtitleData = [];
        // COVER_TEXT_PLACEHOLDER
        // TEAMS_DATA_PLACEHOLDER
        // FUN_FACT_PLACEHOLDER
        // TIMINGS_PLACEHOLDER

        // Populate static data into containers on page load
        // Populate static data into containers on page load
        if (typeof teamsData !== 'undefined' && Array.isArray(teamsData) && teamsData.length > 0) {
            const teamsContainer = document.getElementById('teams-list-container');
            if (teamsContainer) {
                teamsContainer.innerHTML = teamsData.map((team, index) => `
                    <div class="team-item-card">
                        <div class="team-player-wrapper">
                            <img src="cropped_transparent_${index + 1}.png" class="team-player-img" alt="${team.english}">
                        </div>
                        <div class="team-info">
                            <div class="team-english">${team.english}</div>
                            <div class="team-chinese-reading">${team.chinese} (${team.pinyin})</div>
                        </div>
                    </div>
                `).join('');
            }
        }

        if (typeof funFactText !== 'undefined' && funFactText) {
            const factTextEl = document.getElementById('fun-fact-text');
            if (factTextEl) factTextEl.innerHTML = funFactText;
        }

        function setSimulationTime(time) {
            const title = document.getElementById('slang-title-wrapper');
            const card = document.getElementById('illustration-card');
            
            // Dynamic state transitions for group stages
            let activeLayout = 'illustration'; // 'illustration', 'countries'

            if (typeof teamsData !== 'undefined' && Array.isArray(teamsData) && teamsData.length > 0) {
                if (typeof audioTimings !== 'undefined' && Array.isArray(audioTimings)) {
                    const currentAudio = audioTimings.find(t => time >= t.start && time < t.end);
                    if (currentAudio) {
                        const fname = currentAudio.filename;
                        if (fname.includes('vi_part2_countries') || fname.includes('vi_part2_funfact') || fname.includes('vi_part3') || fname.includes('zh_ex') || fname.includes('vi_part4')) {
                            activeLayout = 'countries';
                        }
                    } else {
                        if (time > 0) {
                            activeLayout = 'countries';
                        }
                    }
                }
            }

            const teamsContainer = document.getElementById('teams-list-container');
            const funFactContainer = document.getElementById('fun-fact-container');

            if (card && teamsContainer && funFactContainer) {
                if (activeLayout === 'illustration') {
                    if (card.style.display !== 'flex') {
                        card.style.display = 'flex';
                        card.style.opacity = '1';
                    }
                    teamsContainer.style.display = 'none';
                    funFactContainer.style.display = 'none';
                } else if (activeLayout === 'countries') {
                    card.style.display = 'none';
                    if (teamsContainer.style.display !== 'flex') {
                        teamsContainer.style.display = 'flex';
                        // Trigger staggered entrance once per activation
                        if (!window.__countriesAnimated || window.__lastLayout !== 'countries') {
                            window.__countriesAnimated = true;
                            gsap.from(".team-item-card", {
                                opacity: 0,
                                y: 20,
                                stagger: 0.12,
                                duration: 0.6,
                                ease: "back.out(1.5)"
                            });
                        }
                    }
                    funFactContainer.style.display = 'none';
                } else if (activeLayout === 'funfact') {
                    card.style.display = 'none';
                    teamsContainer.style.display = 'none';
                    if (funFactContainer.style.display !== 'flex') {
                        funFactContainer.style.display = 'flex';
                        // Trigger entry animation once per activation
                        if (!window.__funFactAnimated || window.__lastLayout !== 'funfact') {
                            window.__funFactAnimated = true;
                            gsap.from(funFactContainer, {
                                opacity: 0,
                                scale: 0.85,
                                duration: 0.6,
                                ease: "back.out(1.5)"
                            });
                        }
                    }
                }
                window.__lastLayout = activeLayout;
            }
            
            if (time === 0) {
                if (title) {
                    title.style.opacity = '1';
                    title.style.transform = 'scale(1)';
                }
                updateSubtitles(0);
                return;
            }

            // SHAKE ANIMATION TRIGGER
            // SHAKE_TRIGGERS_PLACEHOLDER

            updateSubtitles(time);
        }

        function updateSubtitles(time) {
            const innerBox = document.getElementById('subtitles-inner');
            const activeSub = subtitleData.find(s => time >= s.start && time < s.end);
            
            let textToShow = "";
            if (activeSub) {
                textToShow = activeSub.text;
            } else if (subtitleData.length > 0) {
                if (time >= subtitleData[subtitleData.length - 1].end) {
                    textToShow = subtitleData[subtitleData.length - 1].text;
                } else {
                    textToShow = subtitleData[0].text;
                }
            }
            
            if (innerBox.innerHTML !== textToShow) {
                innerBox.innerHTML = textToShow;
            }
        }

        window.addEventListener("hf-seek", (e) => {
            setSimulationTime(e.detail.time);
        });
    </script>
</body>
</html>
